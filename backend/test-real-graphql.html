<!DOCTYPE html>
<html>
<head>
    <title>Real GraphQL Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .success { border-left: 4px solid #4caf50; }
        .error { border-left: 4px solid #f44336; }
    </style>
</head>
<body>
    <h1>Real GraphQL Frontend Test</h1>
    
    <div class="test-section">
        <h2>Categories Query</h2>
        <button onclick="testCategories()">Test Categories</button>
        <div id="categories-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Products Query</h2>
        <button onclick="testProducts()">Test Products</button>
        <div id="products-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Single Product Query</h2>
        <button onclick="testSingleProduct()">Test Single Product</button>
        <div id="single-product-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Place Order Mutation</h2>
        <button onclick="testPlaceOrder()">Test Place Order</button>
        <div id="place-order-result" class="result"></div>
    </div>

    <script>
        async function makeGraphQLRequest(query, variables = {}) {
            try {
                const response = await fetch('http://localhost:8000/api/graphql-real.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: variables
                    })
                });

                const data = await response.json();
                return data;
            } catch (error) {
                return { errors: [{ message: error.message }] };
            }
        }

        async function testCategories() {
            const query = `
                query GetCategories {
                    categories {
                        name
                    }
                }
            `;

            const result = await makeGraphQLRequest(query);
            displayResult('categories-result', result);
        }

        async function testProducts() {
            const query = `
                query GetProducts {
                    products {
                        id
                        name
                        inStock
                        brand
                        prices {
                            amount
                            currency {
                                symbol
                            }
                        }
                    }
                }
            `;

            const result = await makeGraphQLRequest(query);
            displayResult('products-result', result);
        }

        async function testSingleProduct() {
            const query = `
                query GetProductById($id: String!) {
                    product(id: $id) {
                        id
                        name
                        description
                        inStock
                        brand
                        gallery
                        attributes {
                            id
                            name
                            type
                            items {
                                id
                                displayValue
                                value
                            }
                        }
                        prices {
                            amount
                            currency {
                                label
                                symbol
                            }
                        }
                    }
                }
            `;

            const variables = { id: "huarache-x-stussy-le" };
            const result = await makeGraphQLRequest(query, variables);
            displayResult('single-product-result', result);
        }

        async function testPlaceOrder() {
            const query = `
                mutation PlaceOrder($items: [OrderInputType]!) {
                    placeOrder(items: $items)
                }
            `;

            const variables = {
                items: [
                    { id: "huarache-x-stussy-le", quantity: 2 },
                    { id: "jacket-canada-goosee", quantity: 1 }
                ]
            };

            const result = await makeGraphQLRequest(query, variables);
            displayResult('place-order-result', result);
        }

        function displayResult(elementId, result) {
            const element = document.getElementById(elementId);
            const isSuccess = !result.errors;
            
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
            element.innerHTML = `
                <h4>${isSuccess ? '✅ Success' : '❌ Error'}</h4>
                <pre>${JSON.stringify(result, null, 2)}</pre>
            `;
        }
    </script>
</body>
</html>
